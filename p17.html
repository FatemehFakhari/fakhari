<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>محاسبه محیط مثلث</title>
</head>
<body>

<h2>محاسبه محیط مثلث</h2>

<form onsubmit="calculatePerimeter(event)">
    <label>ضلع اول:</label>
    <input type="number" id="a" required><br><br>

    <label>ضلع دوم:</label>
    <input type="number" id="b" required><br><br>

    <label>ضلع سوم:</label>
    <input type="number" id="c" required><br><br>

    <button type="submit">محاسبه</button>
</form>

<p id="result"></p>

<script>
function calculatePerimeter(e) {
    e.preventDefault();

    let a = document.getElementById("a").value;
    let b = document.getElementById("b").value;
    let c = document.getElementById("c").value;

    let expr = encodeURIComponent(a + "+" + b + "+" + c);

    fetch("https://api.mathjs.org/v4/?expr=" + expr)
        .then(res => res.text())
        .then(result => {
            document.getElementById("result").innerText =
                "محیط مثلث: " + result;
        })
        .catch(() => {
            document.getElementById("result").innerText =
                "خطا در ارتباط با WebAPI";
        });
}
</script>

</body>
</html>
